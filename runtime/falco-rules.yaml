# Custom Falco rules (runtime threat detection). Install Falco via Helm, then load this file
# with `--set-file customRules."custom-rules\.yaml"=runtime/falco-rules.yaml`.
- rule: Shell Spawned in Production Container
  desc: A shell was started inside a container in the production namespace.
  condition: >
    evt.type = execve and evt.dir = < and container.id != host
    and proc.name in (sh, bash, ash, zsh)
    and k8s.ns.name = "production"
  output: >
    Shell in prod container (user=%user.name pod=%k8s.pod.name ns=%k8s.ns.name
    cmd=%proc.cmdline image=%container.image.repository)
  priority: WARNING
  tags: [container, shell, mitre_execution]

- rule: Write Below Binary Dir in Container
  desc: A process wrote to a binary directory, a sign of tampering.
  condition: >
    evt.type in (open, openat, openat2) and evt.is_open_write = true
    and container.id != host
    and (fd.name startswith /bin/ or fd.name startswith /usr/bin/ or fd.name startswith /sbin/)
  output: >
    Write to binary dir (file=%fd.name pod=%k8s.pod.name proc=%proc.name)
  priority: ERROR
  tags: [container, filesystem, mitre_persistence]

- rule: Service Account Token Read by Unexpected Process
  desc: Something read the mounted service account token.
  condition: >
    evt.type in (open, openat, openat2) and evt.is_open_read = true
    and fd.name startswith /var/run/secrets/kubernetes.io/serviceaccount/token
    and container.id != host and not proc.name in (kubelet)
  output: >
    SA token read (proc=%proc.name pod=%k8s.pod.name ns=%k8s.ns.name)
  priority: NOTICE
  tags: [container, credentials, mitre_credential_access]
