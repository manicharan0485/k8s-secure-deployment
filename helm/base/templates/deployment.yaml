{{- /*
  helm/base/templates/deployment.yaml
  Secure deployment template — enforces pod security context, resource limits,
  probes, anti-affinity, and topology spread on every deployment.
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.app.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.app.name }}
    app.kubernetes.io/version: {{ .Values.app.version | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    {{- with .Values.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.app.name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0      # Zero-downtime deploys
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.app.name }}
        app.kubernetes.io/version: {{ .Values.app.version | quote }}
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
    spec:
      # ── Service Account ──────────────────────────────────────────────────
      serviceAccountName: {{ .Values.app.name }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}

      # ── Pod Security Context ─────────────────────────────────────────────
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}

      # ── Anti-Affinity: spread across nodes ───────────────────────────────
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: {{ .Values.app.name }}

      # ── Topology Spread ───────────────────────────────────────────────────
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.app.name }}

      # ── Image Pull Secrets ────────────────────────────────────────────────
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      # ── Node Selector & Tolerations ───────────────────────────────────────
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      # ── Volumes ───────────────────────────────────────────────────────────
      volumes:
        {{- toYaml .Values.extraVolumes | nindent 8 }}

      # ── Containers ────────────────────────────────────────────────────────
      containers:
        - name: {{ .Values.app.name }}
          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ required "image.tag is required (do not use latest)" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          # ── Container Security Context ────────────────────────────────────
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}

          # ── Ports ─────────────────────────────────────────────────────────
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.networkPolicy.metricsPort }}
              protocol: TCP

          # ── Environment Variables ─────────────────────────────────────────
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          # ── Resource Limits ───────────────────────────────────────────────
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          # ── Probes ────────────────────────────────────────────────────────
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}

          # ── Volume Mounts ─────────────────────────────────────────────────
          volumeMounts:
            {{- toYaml .Values.extraVolumeMounts | nindent 12 }}

      # ── Termination ───────────────────────────────────────────────────────
      terminationGracePeriodSeconds: 30
      restartPolicy: Always
