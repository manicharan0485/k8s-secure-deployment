# Native ValidatingAdmissionPolicy (CEL, GA in Kubernetes 1.30). No extra controller needed.
# Complements Pod Security Admission with org-specific rules PSA cannot express.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: pod-baseline-guardrails
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets"]
  validations:
    - expression: >-
        object.spec.template.spec.containers.all(c,
        c.image.contains('@sha256:') || (c.image.contains(':') && !c.image.endsWith(':latest')))
      message: "Images must use an explicit tag (not :latest) or a digest."
    - expression: >-
        object.spec.template.spec.containers.all(c,
        has(c.resources) && has(c.resources.limits) && 'memory' in c.resources.limits)
      message: "Every container must set a memory limit."
    - expression: >-
        object.spec.template.spec.containers.all(c,
        has(c.securityContext) && has(c.securityContext.readOnlyRootFilesystem) &&
        c.securityContext.readOnlyRootFilesystem == true)
      message: "Containers must use a read-only root filesystem."
    - expression: >-
        !has(object.spec.template.spec.hostNetwork) || object.spec.template.spec.hostNetwork == false
      message: "hostNetwork is not allowed."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: pod-baseline-guardrails-prod
spec:
  policyName: pod-baseline-guardrails
  validationActions: [Deny, Audit]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: production
